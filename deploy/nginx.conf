# Nginx site for the Ahenfor website. Replace ahenfor.com with the real domain.
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/ahenfor
#           sudo ln -s /etc/nginx/sites-available/ahenfor /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d ahenfor.com -d www.ahenfor.com     (HTTPS)
server {
    listen 80;
    server_name ahenfor.com www.ahenfor.com;

    # Must be >= MAX_REQUEST_MB in .env (video uploads)
    client_max_body_size 150M;

    location /static/ {
        alias /srv/ahenfor/app/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Only when MEDIA_STORAGE_PROVIDER=local: serve the PUBLIC upload folder directly.
    # Never expose LOCAL_MEDIA_ROOT/private/.
    location /media/public/ {
        alias /srv/ahenfor/uploads/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
    }
}
